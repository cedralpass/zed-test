<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wind Kite Picker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-8">Wind Kite Picker</h1>

        {% if error %}
        <div class="mb-6 p-4 bg-red-100 border-l-4 border-red-500 text-red-700">
            <p class="font-bold">Error</p>
            <p>{{ error }}</p>
        </div>
        {% endif %}

        {% if result %}
        <div class="mb-8 p-6 bg-blue-50 border-2 border-blue-200 rounded-lg text-center">
            <p class="text-sm text-blue-600 uppercase tracking-wide font-semibold">Recommended Kite Size</p>
            <p class="text-5xl font-black text-blue-900">{{ result }}m</p>
        </div>
        {% endif %}

        <form method="POST" class="space-y-6">
            <div>
                <label for="wind_speed" class="block text-sm font-medium text-gray-700 mb-1">Wind Speed (knots)</label>
                <input type="number" step="0.1" name="wind_speed" id="wind_speed" required
                    class="w-full px-4 py-3 rounded-md border border-gray-300 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="e.g. 15">
            </div>

            <div>
                <label for="rider_weight" class="block text-sm font-medium text-gray-700 mb-1">Rider Weight (lbs)</label>
                <input type="number" step="0.1" name="rider_weight" id="rider_weight" required
                    class="w-full px-4 py-3 rounded-md border border-gray-300 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="e.g. 180">
            </div>

            <div>
                <label for="board_type" class="block text-sm font-medium text-gray-700 mb-1">Board Type</label>
                <select name="board_type" id="board_type"
                    class="w-full px-4 pyint-3 py-3 rounded-md border border-gray-300 focus:ring-blue-500 focus:border-blue-500">
                    <option value="twintip">Twintip</option>
                    <option value="surfboard">Surfboard</option>
                    <option value="foil">Foil</option>
                </select>
            </div>

            <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition duration-200">
                Calculate Kite Size
            </button>
        </form>
    </div>

</body>
</html>
